<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%" fill="none">
  <!-- ILEX Logo 06 (Verde) - Indicada para fundos claros -->
  <!-- 4 Pilares Arquitetônicos Verdes -->
  <g id="pillars-green">
    <!-- Pilar 1 (Esquerda) -->
    <polygon points="237,562 338,477 338,898 237,870" fill="#384633" />

    <!-- Pilar 2 (Centro-Esquerda) -->
    <polygon points="367,378 468,304 468,936 367,908" fill="#384633" />

    <!-- Pilar 3 (Torre Central Mais Alta) -->
    <polygon points="498,172 632,62 632,530 498,530" fill="#384633" />

    <!-- Pilar 4 (Lateral Direita) -->
    <polygon points="662,332 762,420 762,495 662,495" fill="#384633" />
  </g>

  <!-- Folha Botânica ILEX -->
  <g id="botanical-leaf">
    <!-- Contorno Dourado Externo -->
    <path d="M 505,935 C 495,850 498,690 635,580 C 690,535 745,540 762,545 C 755,565 740,610 720,660 C 685,745 635,870 505,935 Z" 
          fill="#9C7F56" />

    <!-- Friso Branco Luminoso (Espaçador) -->
    <path d="M 515,935 C 510,860 515,720 620,615 C 665,570 715,565 745,565 C 710,650 650,820 515,935 Z" 
          fill="#FFFFFF" />

    <!-- Corpo da Folha Verde Floresta ILEX -->
    <path d="M 525,935 C 525,840 545,700 650,600 C 705,550 755,555 755,555 C 755,555 730,670 670,780 C 610,890 550,930 525,935 Z" 
          fill="#384633" />

    <!-- Nervura Central Principal -->
    <path d="M 530,930 Q 600,810 740,580" 
          stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" fill="none" />

    <!-- Nervuras Laterais -->
    <path d="M 560,865 Q 600,870 630,850" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" fill="none" />
    <path d="M 570,845 Q 545,830 540,805" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" fill="none" />
    <path d="M 605,785 Q 655,785 685,750" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" fill="none" />
    <path d="M 618,765 Q 580,750 568,710" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" fill="none" />
    <path d="M 655,700 Q 700,690 718,655" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" fill="none" />
    <path d="M 668,680 Q 625,665 612,625" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" fill="none" />
    <path d="M 705,625 Q 730,610 738,585" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" fill="none" />
  </g>
</svg>
